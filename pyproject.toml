[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "aidetect"
version = "1.8.0"
description = "AI-generated text detection toolkit: Binoculars zero-shot + stylometric classifier + ensemble"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "python-docx>=1.1",
    "pypdf>=4.2",
]

[project.optional-dependencies]
gpu = ["torch>=2.3", "transformers>=4.56", "accelerate"]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.6"]

[project.scripts]
aidetect = "aidetect.cli:main"
aidetect-calibrate = "aidetect.calibrate:main"
aidetect-benchmark = "aidetect.benchmark:main"

[tool.setuptools.packages.find]
include = ["aidetect*"]

[tool.pytest.ini_options]
# Lets `pytest` find the package from the repo root without installing it
pythonpath = ["."]
testpaths = ["tests"]
